<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sales Analytics Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive business sales analytics dashboard with KPI metrics, monthly trends, categorical breakdown, regional performance, scatter analysis, Excel file upload, filtering, and data export.">
  <meta property="og:title" content="Sales Analytics Dashboard">
  <meta property="og:description" content="Interactive business sales analytics dashboard with KPI metrics, monthly trends, categorical breakdown, regional performance, scatter analysis, Excel file upload, filtering, and data export.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    try {
      const theme = localStorage.getItem('sales_dashboard_theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (_) {}
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors">
  <app-root></app-root>
</body>
</html>
